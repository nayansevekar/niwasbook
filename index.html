<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NiwasBook: PG, Hostel & Boarding Khata</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons via CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- QRCode.js via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            brand: {
              50: '#fff7ed',
              100: '#ffedd5',
              200: '#fed7aa',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
              900: '#7c2d12',
            }
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #f1f5f9;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    /* Hide scrollbars cleanly while keeping scrollability */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in { animation: fadeSlideUp 0.22s ease-out forwards; }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-brand-100 selection:text-brand-900">

  <!-- Mobile-First App Shell -->
  <div id="app-shell" class="mx-auto min-h-screen max-w-[480px] bg-slate-50 shadow-2xl relative flex flex-col border-x border-slate-200/80">
    
    <!-- Global Toast Banner -->
    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-[92%] max-w-[440px] pointer-events-none flex flex-col gap-2"></div>

    <!-- Custom Modal Container -->
    <div id="modal-overlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-40 hidden items-end sm:items-center justify-center p-0 sm:p-4">
      <div id="modal-box" class="bg-white w-full max-w-[460px] rounded-t-3xl sm:rounded-3xl shadow-2xl p-5 max-h-[88vh] overflow-y-auto animate-in"></div>
    </div>

    <!-- Dynamic Root View -->
    <div id="root-view" class="flex-1 flex flex-col"></div>

  </div>

  <script>
    /**
     * ============================================================================
     * NIWASBOOK CORE STATE & CLEAN-SLATE PERSISTENCE (ZERO HARDCODED DUMMY DATA)
     * ============================================================================
     */
    const STORAGE_KEY = 'niwasbook_clean_v2';

    const CATEGORIES = {
      pg: {
        id: 'pg',
        label: 'PG / Co-Living',
        shortLabel: 'PG / Co-Living',
        icon: 'fa-building-user',
        color: 'orange',
        hasFoodMenu: false,
        occupantLabel: 'Tenant',
        occupantsLabel: 'Tenants',
        placeLabel: 'Society / Building',
        desc: 'Society > Building > Floor > Room, Sub-meter & UPI'
      },
      school: {
        id: 'school',
        label: 'School Boarding',
        shortLabel: 'School Boarding',
        icon: 'fa-school',
        color: 'blue',
        hasFoodMenu: true,
        foodLabel: 'Meal Plan',
        occupantLabel: 'Boarder',
        occupantsLabel: 'Boarders',
        placeLabel: 'School / Class',
        desc: 'School > Class Grade, Stay/Laundry/Mess, 2 Terms/Yr'
      },
      college: {
        id: 'college',
        label: 'College Hostel',
        shortLabel: 'College Hostel',
        icon: 'fa-graduation-cap',
        color: 'indigo',
        hasFoodMenu: true,
        foodLabel: 'Mess Timetable',
        occupantLabel: 'Hosteller',
        occupantsLabel: 'Hostellers',
        placeLabel: 'College / Block',
        desc: 'College > Block > Room, Student+Parent, 2 Sems/Yr'
      }
    };

    const ROLES = [
      { id: 'owner', label: 'Owner / Warden', sub: 'Manage properties, fees, UPI & notices', icon: 'fa-user-tie' },
      { id: 'resident', label: 'PG / Co-Living Resident', sub: 'View room rent, sub-meter & pay UPI', icon: 'fa-bed' },
      { id: 'parent', label: 'Parent / Guardian', sub: 'Track child term/semester fees & notices', icon: 'fa-hands-holding-child' },
      { id: 'hosteller', label: 'College Hosteller', sub: 'View block room, mess timetable & dues', icon: 'fa-user-graduate' }
    ];

    function getEmptyState() {
      return {
        currentUser: null, // { name, mobile, email, role }
        accounts: [],      // Registered accounts on this device
        activeCategory: 'pg',
        activeTab: 'dashboard',
        upi: {
          id: '',
          payeeName: ''
        },
        // Category-specific clean collections (100% empty on first launch)
        pg: {
          units: [],      // { id, society, building, floor, roomNo, capacity, rentPerBed, meterPrev, meterCurr, ratePerUnit }
          occupants: []   // { id, unitId, name, mobile, rentDue, elecUnits, elecDue, paidAmount, status, joinedAt }
        },
        school: {
          classes: [],    // { id, schoolName, classGrade, capacity, stayFee, laundryFee, messFee }
          boarders: [],   // { id, classId, studentName, parentName, parentMobile, activeTerm: 'Term 1' | 'Term 2', paidTerm1, paidTerm2 }
          mealPlan: []    // { id, day, breakfast, lunch, dinner, updatedAt }
        },
        college: {
          rooms: [],      // { id, collegeName, blockName, roomNo, capacity, hostelFee, messFee }
          hostellers: [], // { id, roomId, studentName, studentMobile, parentName, parentMobile, activeSem: 'Sem 1' | 'Sem 2', paidSem1, paidSem2 }
          messTimetable: [] // { id, day, breakfast, lunch, snacks, dinner }
        },
        notices: []       // { id, category, title, message, targetGroup, sentToCount, createdAt }
      };
    }

    let state = loadState();
    let authDraft = {
      step: 'form', // 'form' | 'otp'
      name: '',
      mobile: '',
      email: '',
      role: 'owner',
      generatedOtp: ''
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return getEmptyState();
        const parsed = JSON.parse(raw);
        return { ...getEmptyState(), ...parsed };
      } catch (e) {
        return getEmptyState();
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        showToast('Storage warning: Could not save locally.', 'error');
      }
    }

    function uid(prefix = 'id') {
      return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
    }

    function formatINR(num) {
      const val = Number(num) || 0;
      return '₹' + val.toLocaleString('en-IN');
    }

    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /**
     * ============================================================================
     * TOAST & MODAL HELPERS (NO browser alert/confirm used anywhere)
     * ============================================================================
     */
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const styles = {
        success: 'bg-emerald-600 text-white border-emerald-500',
        error: 'bg-rose-600 text-white border-rose-500',
        warning: 'bg-amber-500 text-slate-950 border-amber-400',
        info: 'bg-slate-900 text-white border-slate-700'
      };
      const icons = {
        success: 'fa-circle-check',
        error: 'fa-circle-exclamation',
        warning: 'fa-triangle-exclamation',
        info: 'fa-bell'
      };
      toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-2xl shadow-xl border text-xs font-semibold animate-in ${styles[type] || styles.info}`;
      toast.innerHTML = `<i class="fa-solid ${icons[type] || icons.info} text-sm"></i><span class="flex-1 leading-snug">${escapeHTML(message)}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.25s ease';
        setTimeout(() => toast.remove(), 260);
      }, 3600);
    }

    function openModal(htmlContent) {
      const overlay = document.getElementById('modal-overlay');
      const box = document.getElementById('modal-box');
      box.innerHTML = htmlContent;
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
    }

    function closeModal() {
      const overlay = document.getElementById('modal-overlay');
      overlay.classList.add('hidden');
      overlay.classList.remove('flex');
    }

    document.getElementById('modal-overlay').addEventListener('click', (e) => {
      if (e.target.id === 'modal-overlay') closeModal();
    });

    /**
     * ============================================================================
     * AUTHENTICATION & ACCOUNT CREATION (MOBILE + GMAIL + OTP)
     * ============================================================================
     */
    function renderAuthScreen() {
      const root = document.getElementById('root-view');
      root.innerHTML = `
        <div class="flex-1 flex flex-col justify-between p-5 bg-gradient-to-b from-brand-600 via-brand-600 to-slate-50">
          <!-- Brand Header -->
          <div class="pt-4 pb-6 text-white">
            <div class="flex items-center gap-3 mb-4">
              <div class="w-12 h-12 rounded-2xl bg-white text-brand-600 flex items-center justify-center shadow-lg text-2xl">
                <i class="fa-solid fa-book-open-reader"></i>
              </div>
              <div>
                <h1 class="text-2xl font-extrabold tracking-tight">NiwasBook</h1>
                <p class="text-xs text-brand-100 font-medium">PG, Hostel & School Boarding Khata</p>
              </div>
            </div>
            <p class="text-sm text-orange-50/95 leading-relaxed">
              100% clean-slate digital ledger. Sign in with your Mobile & Gmail OTP to manage properties or view your room & fee updates.
            </p>
          </div>

          <!-- Auth Card -->
          <div class="bg-white rounded-3xl shadow-xl border border-slate-100 p-5 mb-4 animate-in">
            ${authDraft.step === 'form' ? `
              <h2 class="text-lg font-bold text-slate-900 mb-1">Create Account / Sign In</h2>
              <p class="text-xs text-slate-500 mb-4">Select your role and verify via 6-digit OTP</p>

              <!-- Role Selector -->
              <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-2">1. Select Your Role</label>
              <div class="grid grid-cols-1 gap-2 mb-4">
                ${ROLES.map(r => `
                  <button type="button" onclick="selectAuthRole('${r.id}')"
                    class="flex items-center gap-3 p-3 rounded-2xl border text-left transition-all ${authDraft.role === r.id ? 'border-brand-600 bg-brand-50/70 ring-2 ring-brand-500/20' : 'border-slate-200 hover:border-slate-300 bg-white'}">
                    <div class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0 ${authDraft.role === r.id ? 'bg-brand-600 text-white' : 'bg-slate-100 text-slate-600'}">
                      <i class="fa-solid ${r.icon}"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                      <div class="text-xs font-bold text-slate-900 truncate">${r.label}</div>
                      <div class="text-[11px] text-slate-500 truncate">${r.sub}</div>
                    </div>
                    <i class="fa-solid ${authDraft.role === r.id ? 'fa-circle-check text-brand-600' : 'fa-circle text-slate-200'}"></i>
                  </button>
                `).join('')}
              </div>

              <!-- User Details -->
              <form onsubmit="handleSendOtp(event)" class="space-y-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Full Name</label>
                  <input type="text" id="auth-name" required value="${escapeHTML(authDraft.name)}" placeholder="Enter your full name"
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:border-brand-600 focus:ring-2 focus:ring-brand-500/20" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Mobile Number (+91)</label>
                  <input type="tel" id="auth-mobile" required pattern="[0-9]{10}" maxlength="10" value="${escapeHTML(authDraft.mobile)}" placeholder="10-digit mobile number"
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:border-brand-600 focus:ring-2 focus:ring-brand-500/20" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Gmail Address</label>
                  <input type="email" id="auth-email" required value="${escapeHTML(authDraft.email)}" placeholder="yourname@gmail.com"
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:border-brand-600 focus:ring-2 focus:ring-brand-500/20" />
                </div>
                <button type="submit" class="w-full py-3.5 rounded-2xl bg-brand-600 hover:bg-brand-700 active:scale-[0.99] text-white font-bold text-sm shadow-lg shadow-brand-600/25 transition-all flex items-center justify-center gap-2 mt-2">
                  <span>Send Verification OTP</span>
                  <i class="fa-solid fa-arrow-right"></i>
                </button>
              </form>
            ` : `
              <button type="button" onclick="backToAuthForm()" class="text-xs font-semibold text-brand-600 flex items-center gap-1.5 mb-3">
                <i class="fa-solid fa-arrow-left"></i> Edit Mobile / Gmail
              </button>
              <h2 class="text-lg font-bold text-slate-900 mb-1">Verify 6-Digit OTP</h2>
              <p class="text-xs text-slate-500 mb-4">
                Sent to <strong class="text-slate-800">+91 ${escapeHTML(authDraft.mobile)}</strong> & <strong class="text-slate-800">${escapeHTML(authDraft.email)}</strong>
              </p>

              <!-- Instant Offline OTP Helper Box -->
              <div class="bg-amber-50 border border-amber-200 rounded-2xl p-3 mb-4 flex items-center justify-between">
                <div>
                  <div class="text-[11px] font-bold text-amber-800 uppercase">Instant Verification Code</div>
                  <div class="text-lg font-extrabold tracking-widest text-amber-950">${authDraft.generatedOtp}</div>
                </div>
                <button type="button" onclick="autoFillOtp()" class="px-3 py-1.5 rounded-xl bg-amber-600 text-white text-xs font-bold shadow-xs">
                  Auto-Fill
                </button>
              </div>

              <form onsubmit="handleVerifyOtp(event)" class="space-y-4">
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Enter 6-Digit OTP</label>
                  <input type="text" id="auth-otp-input" required maxlength="6" pattern="[0-9]{6}" placeholder="••••••"
                    class="w-full px-4 py-3 rounded-xl border border-slate-300 text-center text-xl font-extrabold tracking-[0.4em] focus:outline-none focus:border-brand-600 focus:ring-2 focus:ring-brand-500/20" />
                </div>
                <button type="submit" class="w-full py-3.5 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm shadow-lg shadow-emerald-600/25 transition-all">
                  Verify & Enter NiwasBook
                </button>
              </form>
            `}
          </div>

          <div class="text-center text-[11px] text-slate-500 pb-2">
            Offline-First Local Storage • Zero Server Tracking • Made for India
          </div>
        </div>
      `;
    }

    function selectAuthRole(roleId) {
      const nameEl = document.getElementById('auth-name');
      const mobEl = document.getElementById('auth-mobile');
      const emEl = document.getElementById('auth-email');
      if (nameEl) authDraft.name = nameEl.value;
      if (mobEl) authDraft.mobile = mobEl.value;
      if (emEl) authDraft.email = emEl.value;
      authDraft.role = roleId;
      renderAuthScreen();
    }

    function handleSendOtp(e) {
      e.preventDefault();
      authDraft.name = document.getElementById('auth-name').value.trim();
      authDraft.mobile = document.getElementById('auth-mobile').value.trim();
      authDraft.email = document.getElementById('auth-email').value.trim();
      authDraft.generatedOtp = String(Math.floor(100000 + Math.random() * 900000));
      authDraft.step = 'otp';
      showToast(`OTP ${authDraft.generatedOtp} sent to +91 ${authDraft.mobile}`, 'success');
      renderAuthScreen();
    }

    function backToAuthForm() {
      authDraft.step = 'form';
      renderAuthScreen();
    }

    function autoFillOtp() {
      const input = document.getElementById('auth-otp-input');
      if (input) input.value = authDraft.generatedOtp;
    }

    function handleVerifyOtp(e) {
      e.preventDefault();
      const entered = document.getElementById('auth-otp-input').value.trim();
      if (entered !== authDraft.generatedOtp) {
        showToast('Invalid OTP. Please enter the 6-digit code shown above.', 'error');
        return;
      }
      const userObj = {
        name: authDraft.name,
        mobile: authDraft.mobile,
        email: authDraft.email,
        role: authDraft.role
      };
      state.currentUser = userObj;
      // Save or update in local accounts directory
      const existingIdx = state.accounts.findIndex(a => a.mobile === userObj.mobile && a.role === userObj.role);
      if (existingIdx >= 0) state.accounts[existingIdx] = userObj;
      else state.accounts.push(userObj);

      // Default category matching role
      if (userObj.role === 'hosteller') state.activeCategory = 'college';
      if (userObj.role === 'parent' && state.activeCategory !== 'school' && state.activeCategory !== 'college') {
        state.activeCategory = 'school';
      }
      state.activeTab = 'dashboard';
      saveState();
      showToast(`Welcome, ${userObj.name}!`, 'success');
      renderApp();
    }

    function logoutUser() {
      state.currentUser = null;
      authDraft.step = 'form';
      saveState();
      renderApp();
    }

    /**
     * ============================================================================
     * MAIN APPLICATION SHELL & CATEGORY SWITCHER
     * ============================================================================
     */
    function renderApp() {
      if (!state.currentUser) {
        renderAuthScreen();
        return;
      }
      if (state.currentUser.role === 'owner') {
        renderOwnerShell();
      } else {
        renderMemberPortal();
      }
    }

    function setCategory(catId) {
      state.activeCategory = catId;
      state.activeTab = 'dashboard';
      saveState();
      renderApp();
    }

    function setTab(tabId) {
      state.activeTab = tabId;
      saveState();
      renderApp();
    }

    function renderOwnerShell() {
      const cat = CATEGORIES[state.activeCategory];
      const root = document.getElementById('root-view');

      // Build dynamic navigation tabs per category requirements
      // Note: PG/Co-Living & Working Hostel explicitly have NO food menu tab—only Notices!
      const tabs = [
        { id: 'dashboard', label: 'Dashboard', icon: 'fa-chart-pie' },
        { id: 'property', label: cat.id === 'school' ? 'Add Class' : (cat.id === 'college' ? 'Add Block' : 'Add Building'), icon: 'fa-building-circle-plus' },
        { id: 'occupants', label: `Add ${cat.occupantLabel}`, icon: 'fa-user-plus' },
        ...(cat.hasFoodMenu ? [{ id: 'food', label: cat.id === 'school' ? 'Meal Plan' : 'Mess Table', icon: 'fa-utensils' }] : []),
        { id: 'notices', label: 'Notices', icon: 'fa-bullhorn' }
      ];

      root.innerHTML = `
        <!-- Top Sticky Header -->
        <header class="bg-brand-600 text-white px-4 pt-4 pb-3 sticky top-0 z-30 shadow-md">
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2.5">
              <div class="w-9 h-9 rounded-xl bg-white/15 backdrop-blur-xs flex items-center justify-center text-lg">
                <i class="fa-solid fa-book-open-reader"></i>
              </div>
              <div>
                <div class="flex items-center gap-1.5">
                  <h1 class="text-base font-extrabold tracking-tight">NiwasBook</h1>
                  <span class="text-[10px] font-bold uppercase px-1.5 py-0.5 rounded-md bg-white/20">Owner</span>
                </div>
                <p class="text-[11px] text-brand-100 truncate max-w-[200px]">${escapeHTML(state.currentUser.name)} • +91 ${escapeHTML(state.currentUser.mobile)}</p>
              </div>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="openUpiAndSettingsModal()" title="Owner UPI & Backup Settings"
                class="px-2.5 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all ${state.upi.id ? 'bg-emerald-500/25 text-white border border-emerald-300/40' : 'bg-amber-400 text-slate-950 animate-pulse'}">
                <i class="fa-solid fa-qrcode"></i>
                <span>${state.upi.id ? 'UPI Ready' : 'Set UPI'}</span>
              </button>
              <button onclick="openProfileSwitcherModal()" title="Account & Role Switcher"
                class="w-8 h-8 rounded-xl bg-white/15 hover:bg-white/25 flex items-center justify-center text-xs">
                <i class="fa-solid fa-user-gear"></i>
              </button>
            </div>
          </div>

          <!-- 3 Category Selector Pills -->
          <div class="grid grid-cols-3 gap-1.5 pb-0.5">
            ${Object.values(CATEGORIES).map(c => `
              <button onclick="setCategory('${c.id}')"
                class="px-2 py-1.5 rounded-xl text-[11px] font-bold flex items-center justify-center gap-1.5 transition-all ${state.activeCategory === c.id ? 'bg-white text-brand-700 shadow-sm' : 'bg-brand-700/60 text-orange-100 hover:bg-brand-700'}">
                <i class="fa-solid ${c.icon}"></i>
                <span class="truncate">${c.shortLabel}</span>
              </button>
            `).join('')}
          </div>
        </header>

        <!-- Main Scrollable Content Area -->
        <main class="flex-1 p-4 pb-24 space-y-4 overflow-y-auto">
          ${renderOwnerTabContent()}
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] bg-white border-t border-slate-200 px-2 py-1.5 flex justify-around items-center z-30 shadow-[0_-4px_20px_rgba(0,0,0,0.05)]">
          ${tabs.map(t => `
            <button onclick="setTab('${t.id}')"
              class="flex-1 py-1.5 px-1 rounded-xl flex flex-col items-center gap-1 transition-all ${state.activeTab === t.id ? 'text-brand-600 font-bold bg-brand-50/70' : 'text-slate-500 font-medium hover:text-slate-800'}">
              <i class="fa-solid ${t.icon} text-base"></i>
              <span class="text-[10px] leading-none truncate max-w-full">${t.label}</span>
            </button>
          `).join('')}
        </nav>
      `;
    }

    function renderOwnerTabContent() {
      const catId = state.activeCategory;
      const tab = state.activeTab;

      if (catId === 'pg') {
        if (tab === 'dashboard') return renderPgWorkingDashboard(catId);
        if (tab === 'property') return renderPgWorkingPropertyTab(catId);
        if (tab === 'occupants') return renderPgWorkingOccupantsTab(catId);
        if (tab === 'notices') return renderNoticesTab(catId);
      }

      if (catId === 'school') {
        if (tab === 'dashboard') return renderSchoolDashboard();
        if (tab === 'property') return renderSchoolClassTab();
        if (tab === 'occupants') return renderSchoolBoardersTab();
        if (tab === 'food') return renderSchoolMealPlanTab();
        if (tab === 'notices') return renderNoticesTab('school');
      }

      if (catId === 'college') {
        if (tab === 'dashboard') return renderCollegeDashboard();
        if (tab === 'property') return renderCollegeBlockTab();
        if (tab === 'occupants') return renderCollegeHostellersTab();
        if (tab === 'food') return renderCollegeMessTab();
        if (tab === 'notices') return renderNoticesTab('college');
      }
      return '';
    }

    /**

    function handleAddPgWorkingUnit(e, catId) {
      e.preventDefault();
      const unit = {
        id: uid('unit'),
        society: document.getElementById('pw-society').value.trim(),
        building: document.getElementById('pw-building').value.trim(),
        floor: document.getElementById('pw-floor').value.trim(),
        roomNo: document.getElementById('pw-room').value.trim(),
        capacity: Number(document.getElementById('pw-capacity').value) || 1,
        rentPerBed: Number(document.getElementById('pw-rent').value) || 0,
        meterPrev: Number(document.getElementById('pw-meter-prev').value) || 0,
        meterCurr: Number(document.getElementById('pw-meter-curr').value) || 0,
        ratePerUnit: Number(document.getElementById('pw-meter-rate').value) || 0
      };
      state[catId].units.push(unit);
      saveState();
      showToast(`Room ${unit.roomNo} added to ${unit.building}!`, 'success');
      renderApp();
    }

    function openCloneRoomsModal(catId, templateUnitId) {
      const unit = state[catId].units.find(u => u.id === templateUnitId);
      if (!unit) return;
      openModal(`
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <h3 class="text-base font-extrabold text-slate-900">Add More Rooms in ${escapeHTML(unit.building)}</h3>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center">

            </button>
          </div>

            Copy settings from <strong>${escapeHTML(unit.society)} (${escapeHTML(unit.building)})</strong>. Enter 1 or more comma-separated Room/Apartment numbers below and customize floor, beds, or rent if needed.
          </p>
          <form onsubmit="handleCloneRooms(event, '${catId}', '${unit.id}')" class="space-y-3">

              <label class="block text-xs font-bold text-slate-700 mb-1">New Room / Apartment Numbers (comma-separated) *</label>

                <label class="block text-[11px] font-bold text-slate-700 mb-1">Floor No.</label>

                  class="w-full px-2.5 py-2 rounded-xl border border-slate-300 text-xs" />
              </div>
              <div>
                <label class="block text-[11px] font-bold text-slate-700 mb-1">Beds / Room</label>
                <input type="number" id="clone-cap" min="1" value="${unit.capacity}"
                  class="w-full px-2.5 py-2 rounded-xl border border-slate-300 text-xs" />
              </div>
              <div>
                <label class="block text-[11px] font-bold text-slate-700 mb-1">Rent / Bed (₹)</label>
                <input type="number" id="clone-rent" min="0" value="${unit.rentPerBed}"
                  class="w-full px-2.5 py-2 rounded-xl border border-slate-300 text-xs" />
              </div>
            </div>
            <button type="submit" class="w-full py-3 rounded-2xl bg-brand-600 text-white font-bold text-xs shadow-md">
              Create Selected Rooms
            </button>
          </form>
        </div>
      `);
    }

    function handleCloneRooms(e, catId, templateUnitId) {
      e.preventDefault();
      const template = state[catId].units.find(u => u.id === templateUnitId);
      if (!template) return;
      const rawRooms = document.getElementById('clone-rooms-list').value;
      const roomNumbers = rawRooms.split(',').map(r => r.trim()).filter(Boolean);
      if (roomNumbers.length === 0) {
        showToast('Enter at least one room number.', 'error');
        return;
      }
      const floor = document.getElementById('clone-floor').value.trim() || template.floor;
      const capacity = Number(document.getElementById('clone-cap').value) || template.capacity;
      const rentPerBed = Number(document.getElementById('clone-rent').value) || template.rentPerBed;

      roomNumbers.forEach(rn => {
        state[catId].units.push({
          id: uid('unit'),
          society: template.society,
          building: template.building,
          floor,
          roomNo: rn,
          capacity,
          rentPerBed,
          meterPrev: 0,
          meterCurr: 0,
          ratePerUnit: template.ratePerUnit
        });
      });

      saveState();
      closeModal();
      showToast(`Added ${roomNumbers.length} room(s) to ${template.building}!`, 'success');
      renderApp();
    }

    function openUpdateMeterModal(catId, unitId) {

      openModal(`

    function handleUpdateMeter(e, catId, unitId) {
      e.preventDefault();
      const unit = state[catId].units.find(u => u.id === unitId);
      if (!unit) return;
      unit.meterPrev = Number(document.getElementById('upd-prev').value) || 0;
      unit.meterCurr = Number(document.getElementById('upd-curr').value) || 0;
      unit.ratePerUnit = Number(document.getElementById('upd-rate').value) || 0;

      const roomOccs = state[catId].occupants.filter(o => o.unitId === unitId);
      if (roomOccs.length > 0) {
        const totalUnits = Math.max(0, unit.meterCurr - unit.meterPrev);
        const totalElecCost = totalUnits * unit.ratePerUnit;
        const perHeadUnits = Math.round((totalUnits / roomOccs.length) * 10) / 10;
        const perHeadCost = Math.round(totalElecCost / roomOccs.length);
        roomOccs.forEach(o => {
          o.elecUnits = perHeadUnits;
          o.elecDue = perHeadCost;
        });
      }
      saveState();
      closeModal();
      showToast('Sub-meter updated!', 'success');
      renderApp();
    }

    function handleAddPgWorkingOccupant(e, catId) {
      e.preventDefault();
      const unitId = document.getElementById('occ-unit-id').value;
      const unit = state[catId].units.find(u => u.id === unitId);
      if (!unit) return;

      const currentInRoom = state[catId].occupants.filter(o => o.unitId === unitId).length;
      if (currentInRoom >= Number(unit.capacity)) {
        showToast(`Warning: Room ${unit.roomNo} is already at full capacity (${unit.capacity} beds).`, 'warning');
      }

      const occ = {
        id: uid('occ'),
        unitId,
        name: document.getElementById('occ-name').value.trim(),
        mobile: document.getElementById('occ-mobile').value.trim(),
        rentDue: Number(document.getElementById('occ-rent').value) || 0,
        elecUnits: 0,
        elecDue: Number(document.getElementById('occ-elec').value) || 0,
        paidAmount: 0,
        joinedAt: new Date().toLocaleDateString('en-IN')
      };
      state[catId].occupants.push(occ);
      saveState();
      showToast(`${occ.name} enrolled in Room ${unit.roomNo}!`, 'success');
      setTab('dashboard');

      occ.paidAmount = Number(occ.rentDue || 0) + Number(occ.elecDue || 0);

    function sendPgWorkingWhatsApp(catId, occId) {
      const occ = state[catId].occupants.find(o => o.id === occId);
      if (!occ) return;
      const unit = state[catId].units.find(u => u.id === occ.unitId) || {};
      const totalBill = Number(occ.rentDue || 0) + Number(occ.elecDue || 0);
      const balance = Math.max(0, totalBill - Number(occ.paidAmount || 0));
      const upiLink = state.upi.id ? `upi://pay?pa=${encodeURIComponent(state.upi.id)}&pn=${encodeURIComponent(state.upi.payeeName || 'NiwasBook')}&am=${balance}&cu=INR` : '';

      const text = `Hello ${occ.name},\nYour NiwasBook statement for *${unit.society || ''} (${unit.building || ''}, Room ${unit.roomNo || ''})*:\n• Rent: ${formatINR(occ.rentDue)}\n• Electricity: ${formatINR(occ.elecDue)}\n• *Total Pending: ${formatINR(balance)}*\n\nPay via UPI ID: *${state.upi.id || 'Not Set'}*\n${upiLink ? `Direct UPI Link: ${upiLink}` : ''}\n- Sent via NiwasBook`;
      window.open(`https://wa.me/91${occ.mobile}?text=${encodeURIComponent(text)}`, '_blank');
    }

      const store = state.college;

      let pendingDues = 0;
      let collectedTotal = 0;
      store.hostellers.forEach(h => {
        const room = store.rooms.find(r => r.id === h.roomId) || {};

        ` : ''}

        <!-- Quick Actions -->

          <button onclick="setTab('property')" class="p-3 rounded-2xl bg-slate-900 text-white text-xs font-bold flex items-center justify-center gap-2">
            <i class="fa-solid fa-plus text-indigo-400"></i>
            <span>Enroll College / Block</span>
          </button>
          <button onclick="setTab('occupants')" class="p-3 rounded-2xl bg-brand-600 text-white text-xs font-bold flex items-center justify-center gap-2">
            <i class="fa-solid fa-user-plus"></i>
            <span>Add Hosteller</span>
          </button>

        <!-- Hostellers & 2-Semester Fee Ledger -->

            <div class="space-y-3">

                      </div>
                      <button onclick="deleteCollegeHosteller('${h.id}')" class="text-slate-400 hover:text-rose-600 p-1">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                      </button>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                      <button onclick="toggleCollegeSem('${h.id}', 1)"
                        class="py-2 px-2.5 rounded-xl text-[11px] font-bold border flex items-center justify-between ${h.paidSem1 ? 'bg-emerald-50 border-emerald-300 text-emerald-800' : 'bg-white border-rose-200 text-rose-700'}">

                  </div>

              }).join('')}
            </div>
          `}
        </div>
      `;

    }

    function notifyCollegeGuardianWhatsApp(hostellerId) {
      const h = state.college.hostellers.find(x => x.id === hostellerId);
      if (!h) return;
      const room = state.college.rooms.find(r => r.id === h.roomId) || {};
      const perSem = Number(room.hostelFee || 0) + Number(room.messFee || 0);
      const text = `Dear ${h.parentName},\nCollege Hostel update for *${h.studentName}* (${room.collegeName || ''}, ${room.blockName || ''}, Room ${room.roomNo || ''}):\n• Semester 1 (${formatINR(perSem)}): ${h.paidSem1 ? 'PAID' : 'PENDING'}\n• Semester 2 (${formatINR(perSem)}): ${h.paidSem2 ? 'PAID' : 'PENDING'}\n${state.upi.id ? `Hostel UPI ID: *${state.upi.id}*` : ''}\n- Warden, NiwasBook`;
      window.open(`https://wa.me/91${h.parentMobile}?text=${encodeURIComponent(text)}`, '_blank');
    }

    function renderCollegeMessTab() {
      const store = state.college;
      return `
        <div class="bg-white rounded-2xl border border-slate-200/80 p-4 shadow-xs space-y-4 animate-in">
          <div>
            <h2 class="text-base font-extrabold text-slate-900">College Hostel Mess Timetable</h2>
            <p class="text-xs text-slate-500">Publish daily mess timings & menu for hostellers</p>
          </div>

          <form onsubmit="handleAddCollegeMess(event)" class="space-y-2.5">
            <input type="text" id="cmess-day" required placeholder="Day (e.g. Monday - Wednesday)"
              class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs" />
            <input type="text" id="cmess-bf" required placeholder="Breakfast (7:30 AM - 9:00 AM)"
              class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs" />
            <input type="text" id="cmess-ln" required placeholder="Lunch (12:30 PM - 2:00 PM)"
              class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs" />
            <input type="text" id="cmess-dn" required placeholder="Dinner (7:30 PM - 9:30 PM)"
              class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs" />
            <button type="submit" class="w-full py-3 rounded-2xl bg-brand-600 text-white font-bold text-xs">
              Add to Mess Timetable
            </button>
          </form>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200/80 p-4 shadow-xs space-y-2.5">
          <h3 class="text-sm font-bold text-slate-900">Published Mess Timetable</h3>
          ${store.messTimetable.length === 0 ? `<p class="text-xs text-slate-500 text-center py-4">No mess schedule added yet.</p>` : store.messTimetable.map(m => `
            <div class="p-3 rounded-2xl border border-slate-200 bg-slate-50 space-y-1">
              <div class="text-xs font-extrabold text-indigo-700">${escapeHTML(m.day)}</div>
              <div class="text-[11px] text-slate-700"><strong>Breakfast:</strong> ${escapeHTML(m.breakfast)}</div>
              <div class="text-[11px] text-slate-700"><strong>Lunch:</strong> ${escapeHTML(m.lunch)}</div>
              <div class="text-[11px] text-slate-700"><strong>Dinner:</strong> ${escapeHTML(m.dinner)}</div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function handleAddCollegeMess(e) {
      e.preventDefault();
      state.college.messTimetable.push({
        id: uid('cm'),
        day: document.getElementById('cmess-day').value.trim(),
        breakfast: document.getElementById('cmess-bf').value.trim(),
        lunch: document.getElementById('cmess-ln').value.trim(),
        dinner: document.getElementById('cmess-dn').value.trim()
      });
      saveState();
      showToast('Mess timetable updated!', 'success');
      renderApp();
    }

    /**
     * ============================================================================
     * SHARED OWNER NOTICES TAB (ALL 4 CATEGORIES)
     * ============================================================================
     */
    function renderNoticesTab(catId) {
      const cat = CATEGORIES[catId];
      const catNotices = state.notices.filter(n => n.category === catId);

      return `
        <div class="bg-white rounded-2xl border border-slate-200/80 p-4 shadow-xs space-y-4 animate-in">
          <div>
            <h2 class="text-base font-extrabold text-slate-900">Send Official Notice (${cat.shortLabel})</h2>
            <p class="text-xs text-slate-500">
              ${catId === 'school' ? 'Notices are delivered directly to enrolled parents & boarders.' : 'Broadcast important announcements to your occupants.'}
            </p>
          </div>

          <form onsubmit="handlePostNotice(event, '${catId}')" class="space-y-3">
            <div>
              <label class="block text-[11px] font-bold text-slate-700 mb-1">Notice Title *</label>
              <input type="text" id="ntc-title" required placeholder="e.g. Monthly Rent & Sub-Meter Due Date"
                class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs" />
            </div>
            <div>
              <label class="block text-[11px] font-bold text-slate-700 mb-1">Notice Message *</label>
              <textarea id="ntc-msg" required rows="3" placeholder="Write your notice details here..."
                class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs"></textarea>
            </div>
            <button type="submit" class="w-full py-3 rounded-2xl bg-brand-600 text-white font-bold text-xs shadow-md flex items-center justify-center gap-2">
              <i class="fa-solid fa-paper-plane"></i>
              <span>Publish Notice</span>
            </button>
          </form>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200/80 p-4 shadow-xs space-y-2.5">
          <h3 class="text-sm font-bold text-slate-900">Sent Notices (${catNotices.length})</h3>
          ${catNotices.length === 0 ? `<p class="text-xs text-slate-500 text-center py-6">No notices published yet.</p>` : catNotices.map(n => `
            <div class="p-3.5 rounded-2xl border border-slate-200 bg-slate-50/70 space-y-1">
              <div class="flex items-start justify-between gap-2">
                <div class="text-xs font-extrabold text-slate-900">${escapeHTML(n.title)}</div>
                <span class="text-[10px] text-slate-400 shrink-0">${escapeHTML(n.createdAt)}</span>
              </div>
              <p class="text-xs text-slate-600 leading-relaxed">${escapeHTML(n.message)}</p>
              <div class="text-[10px] font-semibold text-brand-600 pt-1">Audience: ${escapeHTML(n.targetGroup)}</div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function handlePostNotice(e, catId) {
      e.preventDefault();
      const cat = CATEGORIES[catId];
      const title = document.getElementById('ntc-title').value.trim();
      const message = document.getElementById('ntc-msg').value.trim();

      let targetGroup = `All ${cat.occupantsLabel}`;
      if (catId === 'school') targetGroup = `Parents & Boarders (${state.school.boarders.length})`;
      if (catId === 'college') targetGroup = `Hostellers & Guardians (${state.college.hostellers.length})`;

      state.notices.unshift({
        id: uid('ntc'),
        category: catId,
        title,
        message,
        targetGroup,
        createdAt: new Date().toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' })
      });
      saveState();
      showToast('Notice published successfully!', 'success');
      renderApp();
    }

    /**
     * ============================================================================
     * RESIDENT / PARENT / COLLEGE HOSTELLER VIEWPORT (MATCHED BY MOBILE NUMBER)
     * ============================================================================
     */
    function renderMemberPortal() {
      const user = state.currentUser;
      const root = document.getElementById('root-view');
      const mob = user.mobile;

      // Match records across categories using the signed-in mobile number
      const pgMatches = state.pg.occupants
        .filter(o => o.mobile === mob)
        .map(o => ({ ...o, catId: 'pg' }));
      const schoolMatches = state.school.boarders.filter(b => b.parentMobile === mob);
      const collegeMatches = state.college.hostellers.filter(h => h.studentMobile === mob || h.parentMobile === mob);

      const roleMeta = ROLES.find(r => r.id === user.role) || ROLES[1];

      root.innerHTML = `
        <header class="bg-slate-900 text-white px-4 py-4 sticky top-0 z-30 shadow-md">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2.5">
              <div class="w-9 h-9 rounded-xl bg-brand-600 flex items-center justify-center text-white">
                <i class="fa-solid ${roleMeta.icon}"></i>
              </div>
              <div>
                <h1 class="text-sm font-extrabold">${escapeHTML(user.name)}</h1>
                <p class="text-[11px] text-slate-300">${roleMeta.label} • +91 ${escapeHTML(mob)}</p>
              </div>
            </div>
            <button onclick="openProfileSwitcherModal()" class="px-3 py-1.5 rounded-xl bg-white/15 text-xs font-bold">
              Switch Role
            </button>
          </div>
        </header>

        <main class="flex-1 p-4 space-y-4 overflow-y-auto">
          ${(pgMatches.length === 0 && schoolMatches.length === 0 && collegeMatches.length === 0) ? `
            <div class="bg-white rounded-3xl border border-slate-200 p-6 text-center space-y-3 animate-in">
              <div class="w-12 h-12 rounded-2xl bg-brand-100 text-brand-600 flex items-center justify-center mx-auto text-xl">
                <i class="fa-solid fa-link-slash"></i>
              </div>
              <h2 class="text-base font-extrabold text-slate-900">No Active Room Linked to +91 ${escapeHTML(mob)}</h2>
              <p class="text-xs text-slate-500 leading-relaxed">
                Ask your PG Owner, School Warden, or College Hostel Admin to enroll your mobile number (<strong>+91 ${escapeHTML(mob)}</strong>) in NiwasBook. Once enrolled, your room, fees, meal plan, and notices appear here automatically!
              </p>
              <button onclick="openProfileSwitcherModal()" class="w-full py-3 rounded-2xl bg-brand-600 text-white font-bold text-xs">
                Switch to Owner / Warden View to Enroll
              </button>
            </div>
          ` : ''}

          <!-- PG / Co-Living Resident Cards -->
          ${pgMatches.map(occ => {
            const unit = state.pg.units.find(u => u.id === occ.unitId) || {};
            const total = Number(occ.rentDue || 0) + Number(occ.elecDue || 0);
            const balance = Math.max(0, total - Number(occ.paidAmount || 0));
            return `
              <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-xs space-y-3">
                <div class="flex items-center justify-between">
                  <span class="px-2.5 py-0.5 rounded-lg bg-brand-50 text-brand-700 text-[10px] font-bold uppercase">${CATEGORIES[occ.catId].label}</span>
                  <span class="text-xs font-extrabold ${balance === 0 ? 'text-emerald-600' : 'text-rose-600'}">
                    ${balance === 0 ? 'ALL DUES CLEARED' : `DUE: ${formatINR(balance)}`}
                  </span>
                </div>
                <div>
                  <h3 class="text-base font-extrabold text-slate-900">${escapeHTML(unit.society || '')} • ${escapeHTML(unit.building || '')}</h3>
                  <p class="text-xs text-slate-500">Floor ${escapeHTML(unit.floor || '')} • Room ${escapeHTML(unit.roomNo || '')}</p>
                </div>
                <div class="grid grid-cols-2 gap-2 text-xs bg-slate-50 p-3 rounded-xl">
                  <div>Rent: <strong>${formatINR(occ.rentDue)}</strong></div>
                  <div>Electricity: <strong>${formatINR(occ.elecDue)}</strong></div>
                </div>
                ${state.upi.id && balance > 0 ? `
                  <button onclick="openUpiQrModal('${escapeHTML(occ.name)}', ${balance}, 'Room ${escapeHTML(unit.roomNo || '')} Rent')"
                    class="w-full py-3 rounded-2xl bg-brand-600 text-white font-bold text-xs flex items-center justify-center gap-2">
                    <i class="fa-solid fa-qrcode"></i> Pay ${formatINR(balance)} via Owner UPI QR
                  </button>
                ` : ''}
              </div>
            `;
          }).join('')}

          <!-- School Boarding Parent Cards -->
          ${schoolMatches.map(b => {
            const cls = state.school.classes.find(c => c.id === b.classId) || {};
            const perTerm = Number(cls.stayFee || 0) + Number(cls.laundryFee || 0) + Number(cls.messFee || 0);
            return `
              <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-xs space-y-3">
                <span class="px-2.5 py-0.5 rounded-lg bg-blue-50 text-blue-700 text-[10px] font-bold uppercase">School Boarding • Parent View</span>
                <div>
                  <h3 class="text-base font-extrabold text-slate-900">Ward: ${escapeHTML(b.studentName)}</h3>
                  <p class="text-xs text-slate-500">${escapeHTML(cls.schoolName || '')} • Class ${escapeHTML(cls.classGrade || '')}</p>
                </div>
                <div class="grid grid-cols-2 gap-2 text-xs">
                  <div class="p-2.5 rounded-xl border ${b.paidTerm1 ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-rose-50 border-rose-200 text-rose-800'}">
                    Term 1: <strong>${b.paidTerm1 ? 'PAID' : formatINR(perTerm)}</strong>
                  </div>
                  <div class="p-2.5 rounded-xl border ${b.paidTerm2 ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-rose-50 border-rose-200 text-rose-800'}">
                    Term 2: <strong>${b.paidTerm2 ? 'PAID' : formatINR(perTerm)}</strong>
                  </div>
                </div>
              </div>
            `;
          }).join('')}

          <!-- College Hosteller / Guardian Cards -->
          ${collegeMatches.map(h => {
            const room = state.college.rooms.find(r => r.id === h.roomId) || {};
            const perSem = Number(room.hostelFee || 0) + Number(room.messFee || 0);
            return `
              <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-xs space-y-3">
                <span class="px-2.5 py-0.5 rounded-lg bg-indigo-50 text-indigo-700 text-[10px] font-bold uppercase">College Hostel</span>
                <div>
                  <h3 class="text-base font-extrabold text-slate-900">${escapeHTML(h.studentName)}</h3>
                  <p class="text-xs text-slate-500">${escapeHTML(room.collegeName || '')} • ${escapeHTML(room.blockName || '')} • Room ${escapeHTML(room.roomNo || '')}</p>
                </div>
                <div class="grid grid-cols-2 gap-2 text-xs">
                  <div class="p-2.5 rounded-xl border ${h.paidSem1 ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-rose-50 border-rose-200 text-rose-800'}">
                    Sem 1: <strong>${h.paidSem1 ? 'PAID' : formatINR(perSem)}</strong>
                  </div>
                  <div class="p-2.5 rounded-xl border ${h.paidSem2 ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-rose-50 border-rose-200 text-rose-800'}">
                    Sem 2: <strong>${h.paidSem2 ? 'PAID' : formatINR(perSem)}</strong>
                  </div>
                </div>
              </div>
            `;
          }).join('')}

          <!-- Relevant Notices Feed -->
          <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-xs space-y-2.5">
            <h3 class="text-sm font-bold text-slate-900">Recent Notices & Meal Updates (${state.notices.length})</h3>
            ${state.notices.length === 0 ? `<p class="text-xs text-slate-500 py-4 text-center">No notices posted by owner/warden yet.</p>` : state.notices.map(n => `
              <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 space-y-1">
                <div class="flex justify-between text-xs font-bold text-slate-900">
                  <span>${escapeHTML(n.title)}</span>
                  <span class="text-[10px] font-normal text-slate-400">${escapeHTML(n.createdAt)}</span>
                </div>
                <p class="text-xs text-slate-600">${escapeHTML(n.message)}</p>
              </div>
            `).join('')}
          </div>
        </main>
      `;
    }

    /**
     * ============================================================================
     * MODALS: OWNER UPI ENROLLMENT, UPI QR GENERATOR, PROFILE & ROLE SWITCHER
     * ============================================================================
     */
    function openUpiAndSettingsModal() {
      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-base font-extrabold text-slate-900">Owner UPI & Backup Settings</h3>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>

          <form onsubmit="handleSaveOwnerUpi(event)" class="space-y-3">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Owner UPI ID (Required for WhatsApp + QR) *</label>
              <input type="text" id="upi-id-input" required value="${escapeHTML(state.upi.id)}" placeholder="e.g. yourname@okicici or 9876543210@ybl"
                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs focus:border-brand-600 focus:outline-none" />
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Payee / PG / Hostel Display Name *</label>
              <input type="text" id="upi-name-input" required value="${escapeHTML(state.upi.payeeName || state.currentUser?.name || '')}" placeholder="e.g. Sharma Niwas"
                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs focus:border-brand-600 focus:outline-none" />
            </div>
            <button type="submit" class="w-full py-3 rounded-2xl bg-brand-600 text-white font-bold text-xs shadow-md">
              Save Owner UPI Details
            </button>
          </form>

          <div class="pt-3 border-t border-slate-200 space-y-2">
            <div class="text-xs font-bold text-slate-700">Offline Data Backup & Reset</div>
            <div class="grid grid-cols-2 gap-2">
              <button type="button" onclick="exportJsonBackup()" class="py-2.5 px-3 rounded-xl bg-slate-900 text-white text-xs font-bold flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-download"></i> Export JSON
              </button>
              <button type="button" onclick="resetAllData()" class="py-2.5 px-3 rounded-xl bg-rose-50 text-rose-700 border border-rose-200 text-xs font-bold flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-rotate-left"></i> Clear All Data
              </button>
            </div>
          </div>
        </div>
      `);
    }

    function handleSaveOwnerUpi(e) {
      e.preventDefault();
      state.upi.id = document.getElementById('upi-id-input').value.trim();
      state.upi.payeeName = document.getElementById('upi-name-input').value.trim();
      saveState();
      closeModal();
      showToast(`Owner UPI (${state.upi.id}) enrolled!`, 'success');
      renderApp();
    }

    function openUpiQrModal(payerName, amount, note) {
      if (!state.upi.id) {
        showToast('Please enroll your Owner UPI ID first.', 'warning');
        openUpiAndSettingsModal();
        return;
      }
      const upiUrl = `upi://pay?pa=${encodeURIComponent(state.upi.id)}&pn=${encodeURIComponent(state.upi.payeeName || 'NiwasBook')}&am=${Number(amount) || 0}&tn=${encodeURIComponent(note)}&cu=INR`;

      openModal(`
        <div class="text-center space-y-3">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-brand-600 uppercase">Scan & Pay via Any UPI App</span>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
          <div>
            <div class="text-sm font-extrabold text-slate-900">${escapeHTML(payerName)}</div>
            <div class="text-2xl font-black text-emerald-600 mt-0.5">${formatINR(amount)}</div>
            <div class="text-[11px] text-slate-500">${escapeHTML(note)}</div>
          </div>
          <div id="qr-canvas-box" class="flex justify-center p-4 bg-white rounded-2xl border border-slate-200 mx-auto w-fit"></div>
          <div class="text-xs font-semibold text-slate-700 bg-slate-100 py-2 px-3 rounded-xl">
            UPI ID: <strong>${escapeHTML(state.upi.id)}</strong>
          </div>
          <a href="${upiUrl}" class="block w-full py-3 rounded-2xl bg-emerald-600 text-white font-bold text-xs shadow-md">
            Open UPI App to Pay
          </a>
        </div>
      `);

      setTimeout(() => {
        const target = document.getElementById('qr-canvas-box');
        if (target && typeof QRCode !== 'undefined') {
          new QRCode(target, { text: upiUrl, width: 180, height: 180 });
        }
      }, 40);
    }

    function openProfileSwitcherModal() {
      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-base font-extrabold text-slate-900">Account & Role Switcher</h3>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>

          <div class="p-3 rounded-2xl bg-slate-50 border border-slate-200 text-xs space-y-1">
            <div class="font-bold text-slate-900">${escapeHTML(state.currentUser.name)}</div>
            <div class="text-slate-500">+91 ${escapeHTML(state.currentUser.mobile)} • ${escapeHTML(state.currentUser.email)}</div>
          </div>

          <div>
            <label class="block text-[11px] font-bold uppercase text-slate-500 mb-2">Switch Active Role View</label>
            <div class="space-y-1.5">
              ${ROLES.map(r => `
                <button onclick="switchCurrentUserRole('${r.id}')"
                  class="w-full p-2.5 rounded-xl border text-left text-xs font-bold flex items-center justify-between ${state.currentUser.role === r.id ? 'border-brand-600 bg-brand-50 text-brand-700' : 'border-slate-200 text-slate-700'}">
                  <span><i class="fa-solid ${r.icon} mr-2"></i>${r.label}</span>
                  ${state.currentUser.role === r.id ? '<i class="fa-solid fa-check"></i>' : ''}
                </button>
              `).join('')}
            </div>
          </div>

          <button onclick="closeModal(); logoutUser();" class="w-full py-3 rounded-2xl bg-rose-600 text-white font-bold text-xs">
            Sign Out / Create New Account
          </button>
        </div>
      `);
    }

    function switchCurrentUserRole(roleId) {
      state.currentUser.role = roleId;
      saveState();
      closeModal();
      showToast(`Switched to ${ROLES.find(r => r.id === roleId)?.label}`, 'info');
      renderApp();
    }

    function exportJsonBackup() {
      const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(state, null, 2));
      const a = document.createElement('a');
      a.href = dataStr;
      a.download = `niwasbook_backup_${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      showToast('JSON backup downloaded!', 'success');
    }

    function resetAllData() {
      const keepUser = state.currentUser;
      state = getEmptyState();
      state.currentUser = keepUser;
      saveState();
      closeModal();
      showToast('All property & occupant records cleared.', 'info');
      renderApp();
    }

    // Initialize App on Load
    window.addEventListener('DOMContentLoaded', renderApp);
  </script>
</body>
</html>
